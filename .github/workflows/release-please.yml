name: Escudo de Seguridad Python (CI)

on:
  pull_request:
    branches: ["main"]

jobs:
  auditoria:
    name: Escaneo de Vulnerabilidades
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Preparar entorno Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12" # Usa la versión más reciente y estable

      - name: Instalar dependencias y auditor
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pip-audit

      - name: Escanear vulnerabilidades
        # pip-audit fallará y bloqueará el PR si encuentra librerías con fallos de seguridad
        run: pip-audit
